<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guards of Atlantis Draft Randomizer</title>
<style>
body{margin:0;font-family:Georgia,serif;background:radial-gradient(circle at top,#18557a,#06101d 70%);color:#f7ead0}
.wrap{max-width:980px;margin:auto;padding:24px 16px}
.hero{text-align:center;padding:34px 18px;border:2px solid #d4ad57;border-radius:24px;background:linear-gradient(rgba(4,13,26,.55),rgba(4,13,26,.95)),radial-gradient(circle,#2b7fa8,transparent 62%);box-shadow:0 0 38px rgba(212,173,87,.25)}
h1{font-size:36px;margin:0;color:#ffd36b}
.subtitle{margin-top:8px;font-size:17px;opacity:.9}
.card,.team{margin-top:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,211,107,.35);border-radius:18px;padding:20px}
select{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid #d4ad57;background:#101d2f;color:#f7ead0;font-size:16px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.pack{border:1px solid rgba(255,211,107,.35);padding:11px;border-radius:12px;background:rgba(0,0,0,.18)}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffd36b,#b9812d);color:#07111f;font-weight:bold;font-size:17px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:24px}
.team{border:2px solid #d4ad57;background:linear-gradient(180deg,rgba(29,75,108,.9),rgba(8,20,37,.96))}
.team h2{color:#ffd36b;margin-top:0}
.playerBox{padding:12px;margin:12px 0;border-radius:12px;background:rgba(255,255,255,.08);border-left:5px solid #ffd36b}
.pick{margin:6px 0}
.meta{font-size:13px;opacity:.82}
.score{margin-top:12px;font-weight:bold;color:#ffd36b}
.note{font-size:14px;opacity:.78;margin-top:12px}
.bonus{border-left-color:#8ee7ff}
</style>
</head>

<body>
<div class="wrap">
  <section class="hero">
    <h1>Guards of Atlantis</h1>
    <div class="subtitle">6-Player Balanced Draft Randomizer</div>
  </section>

  <section class="card">
    <label>Draft format:</label>
    <select id="format">
      <option value="single">1 hero per player</option>
      <option value="twoPlusBonus" selected>2 heroes per player + 2 team bonus heroes</option>
      <option value="threeEach">3 heroes per player</option>
      <option value="teamPool">Team draft pool: 6 heroes per team</option>
      <option value="bigTeamPool">Big team pool: 9 heroes per team</option>
    </select>

    <h3>Expansions owned</h3>
    <div class="packs" id="packList"></div>

    <button onclick="generateTeams()">Generate Teams</button>
    <div class="note">Balance scores are editable in the code. Lower score = treated as stronger.</div>
  </section>

  <section id="results"></section>
</div>

<script>
const HEROES = [
  { name:"Arien the Tidemaster", pack:"Core", tier:"A", power:2 },
  { name:"Brogan the Destroyer", pack:"Core", tier:"B", power:3 },
  { name:"Dodger the Warlock", pack:"Core", tier:"B", power:3 },
  { name:"Tigerclaw the Cutpurse", pack:"Core", tier:"B", power:3 },
  { name:"Wasp the Warmaiden", pack:"Core", tier:"A", power:2 },
  { name:"Xargatha the Changed", pack:"Core", tier:"B", power:3 },
  { name:"Sabina the Commander", pack:"Core", tier:"B", power:3 },

  { name:"Whisper the Outcast", pack:"Devoted", tier:"S", power:1 },
  { name:"Misa the Samurai", pack:"Devoted", tier:"S", power:1 },
  { name:"Ursafar the Savage", pack:"Devoted", tier:"A", power:2 },
  { name:"Silverarrow the Pathfinder", pack:"Devoted", tier:"A", power:2 },
  { name:"Tali the Spiritcaller", pack:"Devoted", tier:"A", power:2 },

  { name:"Min the Dragonmonk", pack:"Renowned", tier:"A", power:2 },
  { name:"Swift the Sharpshooter", pack:"Renowned", tier:"B", power:3 },
  { name:"Wuk the Grovekeeper", pack:"Renowned", tier:"B", power:3 },
  { name:"Hanu the Trickster", pack:"Renowned", tier:"S", power:1 },
  { name:"Ignatia the Mad", pack:"Renowned", tier:"B", power:3 },

  { name:"Garrus the Gladiator", pack:"Defiant", tier:"S", power:1 },
  { name:"Bain the Bounty Hunter", pack:"Defiant", tier:"A", power:2 },
  { name:"Cutter the Sky Pirate", pack:"Defiant", tier:"S", power:1 },
  { name:"NebKher the Harbinger", pack:"Defiant", tier:"B", power:3 },
  { name:"Trinkets the Scavenger", pack:"Defiant", tier:"A", power:2 },

  { name:"Brynn the Seeker", pack:"Wayward", tier:"B", power:3 },
  { name:"Mortimer the Awakener", pack:"Wayward", tier:"B", power:3 },
  { name:"Widget and Pyro", pack:"Wayward", tier:"B", power:3 },
  { name:"Takahide the Warlord", pack:"Wayward", tier:"C", power:4 },
  { name:"Emmitt the Traveler", pack:"Wayward", tier:"C", power:4 },

  { name:"Rowenna the Vanguard", pack:"Arcane", tier:"B", power:3 },
  { name:"Mrak the Rockshaper", pack:"Arcane", tier:"B", power:3 },
  { name:"Snorri the Runescribe", pack:"Arcane", tier:"C", power:4 },
  { name:"Razzle the Fay", pack:"Arcane", tier:"C", power:4 },
  { name:"Gydion the Archwizard", pack:"Arcane", tier:"C", power:4 }
];

const packs = [...new Set(HEROES.map(h => h.pack))];

function buildPackList(){
  document.getElementById("packList").innerHTML = packs.map(pack => `
    <label class="pack">
      <input type="checkbox" value="${pack}" ${pack==="Core" ? "checked disabled" : "checked"}>
      ${pack}
    </label>
  `).join("");
}

function shuffle(arr){
  return arr.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v);
}

function formatConfig(format){
  if(format === "single") return { perPlayer:1, bonus:0, label:"Assigned Heroes" };
  if(format === "twoPlusBonus") return { perPlayer:2, bonus:2, label:"2 Choices Each + Team Bonus" };
  if(format === "threeEach") return { perPlayer:3, bonus:0, label:"3 Choices Each" };
  if(format === "teamPool") return { teamPool:6, label:"6-Hero Team Pool" };
  if(format === "bigTeamPool") return { teamPool:9, label:"9-Hero Team Pool" };
}

function dealBalanced(pool, totalPerTeam){
  const teams = [
    { name:"Team Sunken Crown", cards:[], score:0 },
    { name:"Team Storm Trident", cards:[], score:0 }
  ];

  const sorted = shuffle(pool).sort((a,b)=>a.power-b.power);

  sorted.forEach(hero=>{
    const eligible = teams.filter(t=>t.cards.length < totalPerTeam).sort((a,b)=>a.score-b.score);
    if(eligible.length){
      eligible[0].cards.push(hero);
      eligible[0].score += hero.power;
    }
  });

  teams.forEach(t => t.cards = shuffle(t.cards));
  return teams;
}

function heroLine(h){
  return `<div class="pick"><strong>${h.name}</strong><div class="meta">${h.pack} · Tier ${h.tier}</div></div>`;
}

function generateTeams(){
  const format = document.getElementById("format").value;
  const config = formatConfig(format);
  const selectedPacks = [...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  const pool = HEROES.filter(h=>selectedPacks.includes(h.pack));

  const playersPerTeam = 3;
  const neededPerTeam = config.teamPool || ((config.perPlayer * playersPerTeam) + config.bonus);
  const totalNeeded = neededPerTeam * 2;

  if(pool.length < totalNeeded){
    alert(`Not enough heroes selected. This format needs ${totalNeeded} heroes, but your selected packs only include ${pool.length}.`);
    return;
  }

  const selectedHeroes = shuffle(pool).slice(0,totalNeeded);
  const teams = dealBalanced(selectedHeroes, neededPerTeam);

  let html = `<h2 style="color:#ffd36b;margin-top:28px;">${config.label}</h2><div class="teams">`;

  teams.forEach(team=>{
    html += `<div class="team"><h2>${team.name}</h2>`;

    if(config.teamPool){
      html += `<div class="playerBox">`;
      team.cards.forEach(h=> html += heroLine(h));
      html += `</div>`;
    } else {
      for(let p=0;p<playersPerTeam;p++){
        const start = p * config.perPlayer;
        const playerHeroes = team.cards.slice(start, start + config.perPlayer);

        html += `<div class="playerBox"><strong>Player ${p+1} chooses from:</strong>`;
        playerHeroes.forEach(h=> html += heroLine(h));
        html += `</div>`;
      }

      if(config.bonus > 0){
        const bonusHeroes = team.cards.slice(playersPerTeam * config.perPlayer);
        html += `<div class="playerBox bonus"><strong>Shared team bonus pool:</strong>`;
        bonusHeroes.forEach(h=> html += heroLine(h));
        html += `</div>`;
      }
    }

    html += `<div class="score">Pool balance score: ${team.score}</div></div>`;
  });

  html += `</div>`;
  document.getElementById("results").innerHTML = html;
}

buildPackList();
</script>
</body>
</html>
